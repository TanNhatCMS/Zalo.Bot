name: Build & Pack NuGet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Đẩy lại lên GitHub Packages các .nupkg của GitHub Release có sẵn (vd v1.0.0); để trống = chỉ build'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Tag vX.Y.Z → Version=X.Y.Z; còn lại → VersionPrefix trong Directory.Build.props + suffix ci.<run>.
      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=-p:VersionSuffix=ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore Zalo.Bot.slnx

      - name: Build
        run: dotnet build Zalo.Bot.slnx -c Release --no-restore ${{ steps.version.outputs.args }}

      - name: Test
        run: dotnet test Zalo.Bot.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack Zalo.Bot.slnx -c Release --no-build -o out ${{ steps.version.outputs.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: |
            out/*.nupkg
            out/*.snupkg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: out

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # Trusted Publishing (https://learn.microsoft.com/nuget/nuget-org/trusted-publishing):
  # OIDC token của GitHub → nuget.org đổi lấy API key tạm (sống 1 giờ) — không lưu API key dài hạn.
  # Policy trên nuget.org: Owner=TanNhatCMS, Repository=Zalo.Bot, Workflow File=nuget.yml, Environment=nuget.
  # Chỉ chạy khi repo có biến NUGET_USER (Settings → Secrets and variables → Actions → Variables) = tên profile nuget.org.
  publish-nuget:
    if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_USER != ''
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Zalo.Bot
    permissions:
      id-token: write # cho phép GitHub phát OIDC token cho job này
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: out

      # Lấy API key ngay trước khi push (key hết hạn sau 1 giờ, mỗi OIDC token chỉ đổi được 1 key).
      - name: NuGet login (OIDC → API key tạm)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # Push .nupkg; .snupkg cùng tên được dotnet nuget push tự đẩy kèm lên symbol server.
      - name: NuGet push
        run: >-
          dotnet nuget push "out/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # GitHub Packages (https://docs.github.com/packages/working-with-a-github-packages-registry/working-with-the-nuget-registry):
  # dùng GITHUB_TOKEN (permissions: packages: write) — không cần PAT. Gói tự gắn vào repo nhờ <RepositoryUrl>
  # trong Directory.Build.props (owner phải trùng namespace của feed). Feed: https://nuget.pkg.github.com/<owner>/index.json
  # Chạy khi push tag vX.Y.Z, hoặc workflow_dispatch với input `tag` để đẩy bản đã phát hành trước đó.
  publish-github:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lấy gói từ artifact build (push tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v8
        with:
          name: nuget
          path: out

      - name: Lấy gói từ GitHub Release (đẩy lại thủ công)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.nupkg" --dir out

      # GitHub Packages không nhận .snupkg → --no-symbols; --skip-duplicate để chạy lại không lỗi 409.
      - name: Push lên GitHub Packages
        run: >-
          dotnet nuget push "out/*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate
          --no-symbols
