name: Build & Pack NuGet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Tag vX.Y.Z → Version=X.Y.Z; còn lại → VersionPrefix trong Directory.Build.props + suffix ci.<run>.
      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=-p:VersionSuffix=ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore ZaloBot.slnx

      - name: Build
        run: dotnet build ZaloBot.slnx -c Release --no-restore ${{ steps.version.outputs.args }}

      - name: Test
        run: dotnet test ZaloBot.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack ZaloBot.slnx -c Release --no-build -o out ${{ steps.version.outputs.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: |
            out/*.nupkg
            out/*.snupkg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: out

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # Trusted Publishing (https://learn.microsoft.com/nuget/nuget-org/trusted-publishing):
  # OIDC token của GitHub → nuget.org đổi lấy API key tạm (sống 1 giờ) — không lưu API key dài hạn.
  # Policy trên nuget.org: Owner=TanNhatCMS, Repository=Zalo.Bot, Workflow File=nuget.yml, Environment=nuget.
  # Chỉ chạy khi repo có biến NUGET_USER (Settings → Secrets and variables → Actions → Variables) = tên profile nuget.org.
  publish-nuget:
    if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_USER != ''
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/ZaloBot.Sdk
    permissions:
      id-token: write # cho phép GitHub phát OIDC token cho job này
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: out

      # Lấy API key ngay trước khi push (key hết hạn sau 1 giờ, mỗi OIDC token chỉ đổi được 1 key).
      - name: NuGet login (OIDC → API key tạm)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # Push .nupkg; .snupkg cùng tên được dotnet nuget push tự đẩy kèm lên symbol server.
      - name: NuGet push
        run: >-
          dotnet nuget push "out/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
