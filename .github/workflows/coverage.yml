name: Test Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # coverlet.collector (đã có trong project test) thu coverage dạng Cobertura; cấu hình ở coverlet.runsettings.
      - name: Test with coverage
        run: >-
          dotnet test Zalo.Bot.slnx -c Release
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory coverage
          --logger trx

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.6.0
        with:
          reports: coverage/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: HtmlInline;Cobertura;MarkdownSummaryGithub;Badges
          tag: '${{ github.run_number }}_${{ github.run_id }}'
          title: Zalo.Bot coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            coverage-report
            coverage/**/*.trx

      - name: Add comment to PR # Only applicable if 'MarkdownSummaryGithub' or one of the other Markdown report types is generated
        if: github.event_name == 'pull_request'
        run: gh pr comment $PR_NUMBER --edit-last --create-if-none --body-file coveragereport/SummaryGithub.md # Adjust path and filename if necessary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
      
      - name: Publish coverage in build summary # Only applicable if 'MarkdownSummaryGithub' or one of the other Markdown report types is generated
        run: cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY # Adjust path and filename if necessary
        shell: bash
