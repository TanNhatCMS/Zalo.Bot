name: Test Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # coverlet.collector (đã có trong project test) thu coverage dạng Cobertura.
      - name: Test with coverage
        run: >
          dotnet test ZaloBot.slnx -c Release
          --collect:"XPlat Code Coverage"
          --results-directory coverage
          --logger trx
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
             DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include=[ZaloBot.Sdk]*

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: coverage/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: HtmlInline;Cobertura;MarkdownSummaryGithub
          title: ZaloBot.Sdk coverage

      - name: Publish summary
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage-report
            coverage/**/*.trx
